# Summaries: faithfulness, completeness, required length. Graded with the rubric + light checks.
tests:
  - id: sum-email-3punti
    lang: it
    grade: true
    doc: [docs/it-email-ritardo-bianchi.md]
    prompt: Riassumi questo scambio di email in esattamente 3 punti elenco, ognuno di una frase.
    expected: "(1) complaint about a delay beyond 48h in Porto Recanati; (2) cause and repair (inverter board, 24/9, Fabbri) + €9 penalty; (3) free check offered and accepted."
    check: {bullets: 3, contains_any: ["9,00", "9 euro", "9 €", "penale"]}

  - id: sum-incident-50w
    lang: en
    grade: true
    doc: [docs/en-incident-report-2026-07-14.md]
    prompt: Summarise this report in no more than 50 words.
    expected: Tom Okafor slipped from a stepladder on 14 July 2026 at Kingsway Dental, bruised knee, no absence, not RIDDOR-reportable; causes wet floor + ladder foot; ladders replaced and checklist updated.
    check: {max_words: 55, contains_all: ["Okafor"]}

  - id: sum-verbale-decisioni
    lang: it
    grade: true
    doc: [docs/it-verbale-riunione-2026-09-03.md]
    prompt: Elenca tutte le decisioni prese nella riunione (solo le decisioni, non le discussioni), ciascuna in una riga.
    expected: "Transit Custom van by October (€38,000); 2 junior engineers by November; Valvex from 1 October; target of 6 UK installations; Pescara postponed to January 2027; next meeting 8 October."
    check: {contains_all: ["Transit", "Valvex", "Pescara"], contains_any: ["2 tecnici", "due tecnici"]}

  - id: sum-es-in-italiano
    lang: it
    grade: true
    doc: [docs/es-contrato-ES-2026-07.md]
    prompt: Riassumi in italiano, in massimo 80 parole, i termini economici e di consegna di questo contratto.
    expected: "12 RX-9 AIR heat pumps at €3,200 = €38,400; 30% on signing, 70% 30 days after delivery; delivery within 45 days DAP Paterna; 3-year warranty; penalty 0.5%/week, max 5%."
    check: {max_words: 90, contains_any: ["38.400", "38400", "38 400"], contains_all: ["45"]}

  - id: sum-manuale-sezioni
    lang: it
    grade: true
    ctx: 8192
    doc: [{path: docs/it-manuale-operativo.md, sections: [10, 12]}]
    prompt: Riassumi in 5 righe il contenuto di queste sezioni del manuale, indicando a quale tipo di impianto si riferiscono.
    expected: "RX AIR air-to-water heat pumps; operation, scheduled maintenance, fault diagnosis; components (inverter compressor, 4-way valve, defrost sensor...); general rules (isolation, original spare parts, calibrated instruments)."
    check: {contains_any: ["pompa di calore", "pompe di calore"]}

  - id: sum-fedelta-trappola
    lang: it
    grade: true
    doc: [docs/it-faq-clienti.md]
    prompt: Riassumi le FAQ in 4 frasi. Attenzione a non aggiungere informazioni che non ci sono.
    expected: "opening hours, on-call service only with a contract, 48h response time, costs (€35 call-out, €42/55 per hour), boiler service €95, heat pumps with 5/2-year warranties, 10% discount on parts, 60-day notice by PEC, areas covered, F-gas. Must not invent prices or services."
    check: {not_contains: ["gratuit", "weekend", "sabato aperti"]}
