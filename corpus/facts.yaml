  titolo: Sicurezza in cantiere e nei locali tecnici
  revisione: 3
  data: 2026-05-12
  responsabile: Davide Marinelli
  dpi_obbligatori: [casco, scarpe antinfortunistiche S3, guanti, occhiali, giubbotto alta visibilità nei cantieri aperti]
  regole_chiave:
    - lavori in quota oltre 2 m solo con imbracatura e secondo punto di ancoraggio
    - lavori su quadri elettrici solo dopo sezionamento e lucchettaggio (lock-out) con cartello
